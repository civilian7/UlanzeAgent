[hotkey]
# 누르고 있는 동안 녹음하는 키. 문자열 하나 또는 목록 (어느 하나라도 눌리면 동작).
#   Ulanzi Vibe Key : "f13"  (Ulanzi Studio에서 Voice Key에 지정)
#   일반 키보드     : "ctrl+win", "right ctrl", "scroll lock", "f9" 등
#   예) key = ["f13", "ctrl+win"]
# 글자 키(space 등)가 들어간 조합은 그 글자가 활성 창에도 입력되므로 권장하지 않는다.
key = "f13"
min_seconds = 0.4        # 이보다 짧은 입력은 무시

[audio]
# 사용할 마이크. ""(또는 "default") = Windows 기본 마이크, 숫자 = 장치 번호,
# 그 외 = 장치 이름의 일부. 번호와 이름은 `uv run stt.py --devices` 로 확인.
# 못 찾으면 기본 마이크로 대체하고 로그에 경고를 남긴다.
device = "AU05"
preroll_ms = 300         # 키 누르기 직전 오디오도 포함 (첫 음절 잘림 방지)
max_seconds = 90

[whisper]
model = "large-v3-turbo"
compute_type = "float16"
language = "ko"
beam_size = 5
# 자주 쓰는 용어를 넣으면 인식률이 크게 오른다 (bench 결과 CER 12% -> 6%)
initial_prompt = "깃허브, 클로드 코드, JSON, README, faster-whisper, 파이썬 가상환경, API, 마이그레이션, 롤백"

[output]
restore_clipboard = true
beep = true

# 후처리: 인식된 그대로 -> 원하는 표기 (정확히 일치하는 부분 문자열 치환)
[replacements]
"GitHub" = "깃허브"
"제이슨" = "JSON"
"링트" = "린트"
"가산 환경" = "가상환경"
"패스트 위스퍼" = "faster-whisper"

# Whisper가 무음에서 만들어내는 대표적 환각 문구 (전체가 일치하면 버림)
[hallucinations]
phrases = ["시청해 주셔서 감사합니다", "구독과 좋아요 부탁드립니다", "감사합니다", "MBC 뉴스"]
